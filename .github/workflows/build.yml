name: Build JENEWBroker Extension

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Build App Inventor extension
    id: build
    uses: pavi2410/AIX-Action@main
    with:
      package-name: com.jenew.broker

  - name: Upload compiled extension
    uses: actions/upload-artifact@v4
    with:
      name: JENEWBroker-build
      path: ${{ steps.build.outputs.extension-path }}
